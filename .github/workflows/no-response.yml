name: No response

on:
  workflow_dispatch:
  schedule:
    # These runs in our repos are spread evenly throughout the day to avoid hitting rate limits.
    # If you change this schedule, consider changing the remaining repositories as well.
    # Runs at 9 am, 9 pm
    - cron: '0 9,21 * * *'

permissions: {}

jobs:
  noResponse:
    permissions:
      issues: write
      pull-requests: write
    name: Handle stale issues and PRs
    uses: mui/mui-public/.github/workflows/general_handle-stale-issues-and-prs.yml@0952193ec0c4431e165278bece0eead9493a5386 # master
