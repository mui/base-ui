# `/benchmark` requests the full suite by rerunning the existing CircleCI benchmark
# job for the exact PR head. CircleCI keeps the original PR identity and OIDC
# claims, so the code-infra dashboard updates its existing consolidated comment.
name: Full benchmark

on:
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  request:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/benchmark' &&
      (
        github.event.action == 'created' ||
        github.event.changes.body.from != '/benchmark'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: full-benchmark-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Verify commenter and request full benchmark
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (permission.permission !== 'admin' && permission.permission !== 'write') {
              core.setFailed('Only maintainers with write access can request a full benchmark.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.state !== 'open') {
              core.setFailed('Full benchmarks can only be requested for an open pull request.');
              return;
            }
            const headSha = pr.head.sha;
            const { data: masterBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'master',
            });
            const masterSha = masterBranch.commit.sha;

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${masterSha}...${headSha}`,
            });
            if (comparison.status !== 'ahead' && comparison.status !== 'identical') {
              core.setFailed(
                'This PR must be updated from master before /benchmark can run the current comparison protocol.',
              );
              return;
            }

            const { data: circleConfig } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.circleci/config.yml',
              ref: headSha,
            });
            const config =
              !Array.isArray(circleConfig) && circleConfig.type === 'file'
                ? Buffer.from(circleConfig.content, 'base64').toString('utf8')
                : '';
            if (!config.includes('# full-benchmark-protocol: 1')) {
              core.setFailed(
                'This PR must be updated from master before /benchmark can run the current comparison protocol.',
              );
              return;
            }

            if (!process.env.CIRCLECI_TOKEN) {
              core.setFailed('The CIRCLECI_TOKEN repository secret is not configured.');
              return;
            }

            const findCircleJob = async () => {
              const { data } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
              });
              return data.statuses.find(
                (status) => status.context === 'ci/circleci: Benchmark tests',
              );
            };

            let circleStatus;
            for (let attempt = 0; attempt < 60; attempt += 1) {
              circleStatus = await findCircleJob();
              if (circleStatus && circleStatus.state !== 'pending') {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            if (!circleStatus || circleStatus.state === 'pending') {
              core.setFailed('The ordinary CircleCI Benchmark tests job has not finished yet.');
              return;
            }

            const jobNumber = /\/(\d+)(?:\?.*)?$/.exec(circleStatus.target_url || '')?.[1];
            if (!jobNumber) {
              core.setFailed(`Could not read a CircleCI job number from ${circleStatus.target_url}.`);
              return;
            }

            const metadataResponse = await fetch(
              `https://circleci.com/api/v1.1/project/github/${context.repo.owner}/${context.repo.repo}/${jobNumber}`,
              { headers: { 'Circle-Token': process.env.CIRCLECI_TOKEN } },
            );
            if (!metadataResponse.ok) {
              core.setFailed(`CircleCI job lookup failed (${metadataResponse.status}).`);
              return;
            }
            const metadata = await metadataResponse.json();
            const workflowId = metadata.workflows?.workflow_id;
            const jobId = metadata.workflows?.job_id;
            if (!workflowId || !jobId) {
              core.setFailed('CircleCI did not return the workflow and job IDs needed for a rerun.');
              return;
            }

            const [{ data: latestPr }, { data: latestMasterBranch }] = await Promise.all([
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }),
              github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'master',
              }),
            ]);
            if (
              latestPr.state !== 'open' ||
              latestPr.head.sha !== headSha ||
              latestMasterBranch.commit.sha !== masterSha
            ) {
              core.setFailed(
                'The PR head or master changed while the benchmark request was being prepared.',
              );
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: 'success',
              context: 'benchmark/full-requested',
              description: 'Full benchmark requested by a maintainer',
              target_url: process.env.RUN_URL,
            });

            const rerunResponse = await fetch(
              `https://circleci.com/api/v2/workflow/${workflowId}/rerun`,
              {
                method: 'POST',
                headers: {
                  'Circle-Token': process.env.CIRCLECI_TOKEN,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ jobs: [jobId], sparse_tree: true }),
              },
            );
            if (!rerunResponse.ok) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: headSha,
                state: 'error',
                context: 'benchmark/full-requested',
                description: 'CircleCI rejected the full benchmark request',
                target_url: process.env.RUN_URL,
              });
              core.setFailed(
                `CircleCI rerun failed (${rerunResponse.status}): ${await rerunResponse.text()}`,
              );
              return;
            }

            core.notice(`Requested a full benchmark for ${headSha}.`);
