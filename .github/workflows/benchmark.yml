# `/benchmark` starts a dedicated CircleCI pipeline for the exact PR head.
# The full master/PR comparison remains in one CircleCI job so the code-infra
# dashboard can update its existing consolidated PR comment.
name: Full benchmark

on:
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  request:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/benchmark' &&
      (
        github.event.action == 'created' ||
        github.event.changes.body.from != '/benchmark'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: full-benchmark-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Verify commenter and request full benchmark
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (permission.permission !== 'admin' && permission.permission !== 'write') {
              core.setFailed('Only maintainers with write access can request a full benchmark.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.state !== 'open') {
              core.setFailed('Full benchmarks can only be requested for an open pull request.');
              return;
            }
            const headSha = pr.head.sha;
            const { data: masterBranch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'master',
            });
            const masterSha = masterBranch.commit.sha;

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${masterSha}...${headSha}`,
            });
            if (comparison.status !== 'ahead' && comparison.status !== 'identical') {
              core.setFailed(
                'This PR must be updated from master before /benchmark can run the current comparison protocol.',
              );
              return;
            }

            const { data: circleConfig } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: '.circleci/config.yml',
              ref: headSha,
            });
            const config =
              !Array.isArray(circleConfig) && circleConfig.type === 'file'
                ? Buffer.from(circleConfig.content, 'base64').toString('utf8')
                : '';
            if (!config.includes('# full-benchmark-protocol: 1')) {
              core.setFailed(
                'This PR must be updated from master before /benchmark can run the current comparison protocol.',
              );
              return;
            }

            if (!process.env.CIRCLECI_TOKEN) {
              core.setFailed('The CIRCLECI_TOKEN repository secret is not configured.');
              return;
            }

            const [{ data: latestPr }, { data: latestMasterBranch }] = await Promise.all([
              github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              }),
              github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'master',
              }),
            ]);
            if (
              latestPr.state !== 'open' ||
              latestPr.head.sha !== headSha ||
              latestMasterBranch.commit.sha !== masterSha
            ) {
              core.setFailed(
                'The PR head or master changed while the benchmark request was being prepared.',
              );
              return;
            }

            const pipelineResponse = await fetch(
              `https://circleci.com/api/v2/project/gh/${context.repo.owner}/${context.repo.repo}/pipeline`,
              {
                method: 'POST',
                headers: {
                  'Circle-Token': process.env.CIRCLECI_TOKEN,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  branch: `pull/${context.issue.number}/head`,
                  parameters: {
                    workflow: 'benchmark',
                    'benchmark-sha': headSha,
                  },
                }),
              },
            );
            if (!pipelineResponse.ok) {
              core.setFailed(
                `CircleCI pipeline request failed (${pipelineResponse.status}): ${await pipelineResponse.text()}`,
              );
              return;
            }

            const pipeline = await pipelineResponse.json();
            core.notice(`Requested CircleCI benchmark pipeline ${pipeline.id} for ${headSha}.`);
