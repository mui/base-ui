# Vale config. More information at https://vale.sh/docs/topics/config/
StylesPath = .github/styles
MinAlertLevel = warning

Packages = Google, ./node_modules/@mui/internal-code-infra/vale

[formats]
mdx = md

[*.{md,mdx}]
# Ignore React component calls
TokenIgnores = (<\/?[A-Z].+>)

# Ignore code injections that start with {{...
BlockIgnores = {{.*

BasedOnStyles = MUI

# Google errors:
Google.GenderBias = YES # No Gender bias
# Google warings:
Google.FirstPerson = YES # Avoid first-person
Google.We = YES # Avoid first-person plural
Google.Will = YES # Avoid future tense
Google.OxfordComma = YES # Prefer Oxford comma

[*.mdx]
# MDX doesn't support HTML comments, see https://vale.sh/docs/keys/commentdelimiters.
CommentDelimiters = {/*, */}

[CHANGELOG*.md]
MUI.CorrectReferenceAllCases = NO

[IMPLEMENTATION_SUMMARY.md]
BasedOnStyles =

# Relax voice rules for blog posts
[docs/src/app/(website)/blog/posts/**]
BasedOnStyles = MUI
Google.GenderBias = YES
Google.FirstPerson = NO
Google.We = NO
Google.Will = NO
Google.OxfordComma = YES

# Ignore agent skill files
[.agents/skills/**]
BasedOnStyles =
Google.GenderBias = NO
Google.FirstPerson = NO
Google.We = NO
Google.Will = NO
Google.OxfordComma = NO
